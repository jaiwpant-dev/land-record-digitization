services:
  - type: web
    name: land-record-backend
    runtime: docker
    repo: https://github.com/jaiwpant-dev/land-record-digitization.git
    branch: main
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LAND_RECORD_API_CORS_ORIGINS
        sync: false
